<!DOCTYPE html>
<html>

<head>
    <title>Finalizar Compra</title>
</head>

<body>

<h1>Finalizar Compra</h1>

<form>

    <fieldset>
        <legend>Endereço de Entrega</legend>

        <label>Nome do destinatário:</label>
        <input type="text" name="nome" required>
        <br><br>

        <label>CPF:</label>
        <input type="text" name="cpf" required>
        <br><br>

        <label>Rua:</label>
        <input type="text" name="rua" required>
        <br><br>

        <label>Número:</label>
        <input type="text" name="numero" required>
        <br><br>

        <label>Complemento:</label>
        <input type="text" name="complemento" required>

    </fieldset>


    <br>


    <fieldset>
        <legend>Opções de Entrega</legend>

        <label>Período de entrega:</label>

        <select required>
            <option value="">Escolha o horário</option>
            <option>Manhã - 08h</option>
            <option>Tarde - 12h às 18h</option>
            <option>Noite - 18h às 22h</option>
        </select>


        <br><br>


        <label>Instruções de entrega:</label>

        <select required>
            <option value="">Escolha uma opção</option>
            <option>Deixar na portaria</option>
            <option>Entregar em mãos</option>
            <option>Ligar ao chegar</option>
        </select>


    </fieldset>


    <br>


    <fieldset>
        <legend>Pagamento e Ofertas</legend>

        <label>Cupom de desconto:</label>
        <input type="text" name="cupom">

        <br><br>

        <input type="checkbox" name="whatsapp">
        Receber ofertas pelo WhatsApp

    </fieldset>


    <br>


    <button type="submit">
        Finalizar Compra
    </button>


</form>

</body>

</html>
